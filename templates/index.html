<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Solver</title>
    <script src="https://unpkg.com/htmx.org@1.8.0"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: black;
            color: #00ff00;
            line-height: 1.6;
            padding: 20px;
        }

        h1,
        h2 {
            color: #00ff00;
            text-align: center;
            text-shadow: 2px 2px #003300;
        }

        button {
            background-color: #003300;
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 5px 10px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
        }

        button:hover {
            background-color: #004d00;
            color: #00ff00;
        }

        input[type="number"] {
            background-color: black;
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 5px;
            font-family: 'Courier New', Courier, monospace;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            border: 2px solid #00ff00;
            padding: 20px;
            background-color: black;
        }

        .tab-content {
            display: none;
            border: 2px solid #00ff00;
            padding: 20px;
            margin-top: 20px;
            background-color: black;
        }

        .active {
            display: block;
        }

        #tetris-board {
            border: 2px solid #00ff00;
            margin-top: 20px;
        }
    </style>
</head>

<body x-data="{ tab: 'simulation' }">
    <div class="container">
        <h1>Tetris Solver</h1>

        <div>
            <button @click="tab = 'simulation'" :class="{ 'active': tab === 'simulation' }">Simulation</button>
            <button @click="tab = 'single-game'" :class="{ 'active': tab === 'single-game' }">Single Game</button>
        </div>

        <div x-show="tab === 'simulation'" class="tab-content" :class="{ 'active': tab === 'simulation' }">
            <h2>Run Simulation</h2>
            <form hx-post="/run_simulation" hx-trigger="submit" hx-target="#simulation-results" hx-swap="innerHTML">
                <div>
                    <label for="goal">Goal:</label>
                    <input type="number" id="goal" name="goal" required value="8">
                </div>
                <div>
                    <label for="tetrominoes">Tetrominoes:</label>
                    <input type="number" id="tetrominoes" name="tetrominoes" required value="40">
                </div>
                <div>
                    <label for="initialHeightMax">Initial Height Max:</label>
                    <input type="number" id="initialHeightMax" name="initialHeightMax" required value="7">
                </div>
                <div>
                    <label for="numGames">Number of Games:</label>
                    <input type="number" id="numGames" name="numGames" required value="100">
                </div>
                <button type="submit">Run Simulation</button>
            </form>
            <div id="simulation-results"></div>
        </div>

        <div x-show="tab === 'single-game'" class="tab-content" :class="{ 'active': tab === 'single-game' }">
            <h2>Run Single Game</h2>
            <form hx-post="/run_single_game" hx-trigger="submit" hx-target="#single-game-results" hx-swap="innerHTML">
                <div>
                    <label for="seed">Seed:</label>
                    <input type="number" id="seed" name="seed" required value="42">
                </div>
                <div>
                    <label for="goal">Goal:</label>
                    <input type="number" id="goal" name="goal" required value="8">
                </div>
                <div>
                    <label for="tetrominoes">Tetrominoes:</label>
                    <input type="number" id="tetrominoes" name="tetrominoes" required value="40">
                </div>
                <div>
                    <label for="initialHeightMax">Initial Height Max:</label>
                    <input type="number" id="initialHeightMax" name="initialHeightMax" required value="7">
                </div>
                <button type="submit">Run Single Game</button>
            </form>
            <div id="single-game-results"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/tetris_visualization.js') }}"></script>
    <script>
        let tetrisVis;

        htmx.on("htmx:afterSwap", function (event) {
            if (event.detail.target.id === "simulation-results") {
                const data = JSON.parse(event.detail.xhr.response);
                const resultsDiv = d3.select('#simulation-results');
                resultsDiv.html('');
                resultsDiv.append('p').text(`Winnable games: ${data.winnable_games}`);
                resultsDiv.append('p').text(`Total games: ${data.total_games}`);
                resultsDiv.append('p').text(`Average time: ${data.average_time.toFixed(3)} seconds`);
                resultsDiv.append('p').text(`Average attempts: ${data.average_attempts.toFixed(2)}`);
            } else if (event.detail.target.id === "single-game-results") {
                const data = JSON.parse(event.detail.xhr.response);
                const resultsDiv = d3.select('#single-game-results');
                resultsDiv.html('');

                resultsDiv.append('p').text(`Result: ${data.result ? 'Winnable' : 'Not Winnable'}`);
                resultsDiv.append('p').text(`Failed Attempts: ${data.failedAttempts}`);

                // Create a container for the Tetris board
                const boardContainer = resultsDiv.append('div')
                    .attr('id', 'tetris-board')
                    .style('width', '200px')
                    .style('height', '400px');

                // Initialize the Tetris board visualization
                tetrisVis = new TetrisVisualization('tetris-board', 10, 20);
                tetrisVis.setBoard(data.initialBoard);
                tetrisVis.setMoves(data.moves);

                // Add controls for the visualization
                const controls = resultsDiv.append('div')
                    .attr('class', 'controls');

                controls.append('button')
                    .text('Previous Move')
                    .on('click', () => tetrisVis.previousMove());

                controls.append('button')
                    .text('Next Move')
                    .on('click', () => tetrisVis.nextMove());

                // Add a speed slider
                const speedControl = controls.append('div').attr('class', 'speed-control');
                speedControl.append('label')
                    .attr('for', 'speed-slider')
                    .text('Animation Speed: ');
                speedControl.append('input')
                    .attr('type', 'range')
                    .attr('id', 'speed-slider')
                    .attr('min', '1')
                    .attr('max', '10')
                    .attr('value', '5')
                    .on('input', function () {
                        // Update animation speed based on slider value
                        const speed = this.value;
                        // Implement speed change logic here
                    });
            }
        });
    </script>
</body>

</html>
