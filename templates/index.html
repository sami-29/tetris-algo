<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Solver</title>
    <script src="https://unpkg.com/htmx.org@1.8.0"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #000;
            color: #0f0;
            line-height: 1.6;
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            border: 2px solid #0f0;
            padding: 20px;
            background-color: #001a00;
            box-shadow: 0 0 10px #0f0;
        }

        h1,
        h2 {
            color: #0f0;
            text-align: center;
            text-shadow: 2px 2px #003300;
        }

        .tab-buttons {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .tab-button {
            background-color: #003300;
            color: #0f0;
            border: 2px solid #0f0;
            padding: 8px 16px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            transition: all 0.3s ease;
            margin: 0 5px;
        }

        .tab-button:hover:not([disabled]) {
            background-color: #004d00;
            box-shadow: 0 0 5px #0f0;
        }

        .tab-button.active {
            background-color: #006600;
            box-shadow: 0 0 10px #0f0;
        }

        .tab-button[disabled] {
            opacity: 0.5;
            cursor: not-allowed;
        }

        input[type="number"] {
            background-color: #001a00;
            color: #0f0;
            border: 2px solid #0f0;
            padding: 5px;
            font-family: 'Courier New', Courier, monospace;
            width: 60px;
        }

        button[type="submit"],
        .btn {
            background-color: #006600;
            color: #0f0;
            border: 2px solid #0f0;
            padding: 8px 8px;
            min-width: 100px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        button[type="submit"]:hover,
        .btn:hover {
            background-color: #008000;
            box-shadow: 0 0 10px #0f0;
        }

        form div {
            margin-bottom: 10px;
        }

        label {
            display: inline-block;
            width: 150px;
        }

        .tab-content {
            display: none;
            border: 2px solid #0f0;
            padding: 20px;
            margin-top: 20px;
            background-color: #001a00;
        }

        .active {
            display: block;
        }

        #tetris-board {
            border: 2px solid #0f0;
            margin-top: 20px;
            box-shadow: 0 0 10px #0f0;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .speed-control {
            display: flex;
            align-items: center;
            justify-content: space-around;
        }


        #sequence-display {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #0f0;
            background-color: #001a00;
            height: 300px;
            overflow-y: auto;
        }

        .tetromino-preview {
            display: inline-block;
            width: 30px;
            height: 30px;
            margin-right: 5px;
            margin-bottom: 5px;
            border: 1px solid #0f0;
            text-align: center;
            line-height: 30px;
            font-size: 14px;
        }

        .form-container {
            margin-bottom: 20px;
        }

        .single-game-layout {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .left-column {
            width: 40%;
        }

        .right-column {
            width: 55%;
        }

        #tetris-board {
            width: 100%;
            height: 600px;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .speed-control {
            display: flex;
            align-items: center;
            justify-content: space-around;
        }

        #speed-slider {
            -webkit-appearance: none;
            width: 100px;
            height: 10px;
            background: #001a00;
            outline: none;
            opacity: 0.8;
            transition: opacity .2s;
            border: 1px solid #0f0;
        }

        #speed-slider:hover {
            opacity: 1;
        }

        #speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: #0f0;
            cursor: pointer;
            border-radius: 50%;
        }

        #speed-slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: #0f0;
            cursor: pointer;
            border-radius: 50%;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #game-info {
            margin-top: 20px;
            padding: 10px;

            background-color: #001a00;
        }

        @media (max-width: 1024px) {
            .single-game-layout {
                flex-direction: column;
            }

            .left-column,
            .right-column {
                width: 100%;
            }
        }
    </style>
</head>

<body x-data x-init="Alpine.store('tab', 'simulation')">
    <div class="container">
        <h1>Tetris Solver</h1>

        <div class="tab-buttons">
            <button @click="setTab('simulation')"
                :class="{ 'tab-button': true, 'active': $store.tab === 'simulation' }">Simulation</button>
            <button @click="setTab('single-game')"
                :class="{ 'tab-button': true, 'active': $store.tab === 'single-game' }">Single Game</button>
        </div>

        <div x-show="$store.tab === 'simulation'" class="tab-content"
            :class="{ 'active': $store.tab === 'simulation' }">
            <h2>Run Simulation</h2>
            <div class="form-container">
                <form hx-post="/run_simulation" hx-trigger="submit" hx-target="#simulation-results" hx-swap="innerHTML">
                    <div>
                        <label for="goal">Goal:</label>
                        <input type="number" id="goal" name="goal" required value="8">
                    </div>
                    <div>
                        <label for="tetrominoes">Tetrominoes:</label>
                        <input type="number" id="tetrominoes" name="tetrominoes" required value="40">
                    </div>
                    <div>
                        <label for="initialHeightMax">Initial Height Max:</label>
                        <input type="number" id="initialHeightMax" name="initialHeightMax" required value="7">
                    </div>
                    <div>
                        <label for="numGames">Number of Games:</label>
                        <input type="number" id="numGames" name="numGames" required value="100">
                    </div>
                    <button type="submit">Run Simulation</button>
                </form>
            </div>
            <div class="results-container" id="simulation-results"></div>
        </div>

        <div x-show="$store.tab === 'single-game'" class="tab-content"
            :class="{ 'active': $store.tab === 'single-game' }">
            <h2>Run Single Game</h2>
            <div class="single-game-layout">
                <div class="left-column">
                    <div class="form-container">
                        <form hx-post="/run_single_game" hx-trigger="submit" hx-target="#single-game-results"
                            hx-swap="innerHTML">
                            <div>
                                <label for="seed">Seed:</label>
                                <input type="number" id="seed" name="seed" required value="42">
                            </div>
                            <div>
                                <label for="goal">Goal:</label>
                                <input type="number" id="goal" name="goal" required value="8">
                            </div>
                            <div>
                                <label for="tetrominoes">Tetrominoes:</label>
                                <input type="number" id="tetrominoes" name="tetrominoes" required value="40">
                            </div>
                            <div>
                                <label for="initialHeightMax">Initial Height Max:</label>
                                <input type="number" id="initialHeightMax" name="initialHeightMax" required value="7">
                            </div>
                            <button type="submit">Run Single Game</button>
                        </form>
                    </div>
                    <div id="sequence-display">
                        <h3>Tetromino Sequence:</h3>
                        <div></div>
                    </div>
                    <div id="game-info"></div>
                </div>
                <div class="right-column">
                    <div id="tetris-board"></div>
                    <div class="controls">
                        <button id="prev-move-btn" class="btn">Previous Move</button>
                        <button id="play-pause-btn" class="btn">Play</button>
                        <button id="next-move-btn" class="btn">Next Move</button>
                        <div class="speed-control">
                            <label for="speed-slider">Animation Speed:</label>
                            <input type="range" id="speed-slider" min="1" max="10" value="5">
                        </div>
                    </div>
                </div>
            </div>
            <div class="results-container" id="single-game-results"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/tetris_visualization.js') }}"></script>
    <script>
        let tetrisVis;

        function setTab(newTab) {
            Alpine.store('tab', newTab);
            updateURL(newTab);
            if (newTab === 'single-game' && tetrisVis) {
                tetrisVis.reset();
            }
        }

        function updateURL(tab) {
            const url = new URL(window.location);
            url.searchParams.set('tab', tab);
            window.history.pushState({}, '', url);
        }

        function loadTabFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            const tabParam = urlParams.get('tab');
            if (tabParam && (tabParam === 'simulation' || tabParam === 'single-game')) {
                Alpine.store('tab', tabParam);
            }
        }

        // Load tab from URL on page load
        window.addEventListener('load', loadTabFromURL);

        // Handle browser back/forward navigation
        window.addEventListener('popstate', loadTabFromURL);

        htmx.on("htmx:afterSwap", function (event) {
            if (event.detail.target.id === "simulation-results") {
                const data = JSON.parse(event.detail.xhr.response);
                const resultsDiv = d3.select('#simulation-results');
                resultsDiv.html('');
                resultsDiv.append('p').text(`Winnable games: ${data.winnable_games}`);
                resultsDiv.append('p').text(`Total games: ${data.total_games}`);
                resultsDiv.append('p').text(`Average time: ${data.average_time.toFixed(3)} seconds`);
                resultsDiv.append('p').text(`Average attempts: ${data.average_attempts.toFixed(2)}`);
            } else if (event.detail.target.id === "single-game-results") {
                const data = JSON.parse(event.detail.xhr.response);
                const gameInfoDiv = d3.select('#game-info');
                gameInfoDiv.html('');
                gameInfoDiv.append('p').text(`Result: ${data.result ? 'Winnable' : 'Not Winnable'}`);
                gameInfoDiv.append('p').text(`Failed Attempts: ${data.failedAttempts}`);
                gameInfoDiv.append('p').attr('id', 'lines-cleared').text(`Lines Cleared: 0/${data.goal || 'undefined'}`);

                // Initialize the Tetris board visualization
                tetrisVis = new TetrisVisualization('tetris-board', 10, 20);
                tetrisVis.setBoard(data.initialBoard);
                tetrisVis.setMoves(data.moves);
                tetrisVis.setSequence(data.sequence);
                tetrisVis.setGoal(parseInt(data.goal));

                // Update sequence display
                const sequenceContainer = d3.select('#sequence-display').select('div');
                sequenceContainer.html(''); // Clear existing content
                data.sequence.forEach((tetromino, index) => {
                    sequenceContainer.append('span')
                        .attr('class', 'tetromino-preview')
                        .text(tetromino)
                        .style('background-color', index === 0 ? '#004d00' : 'transparent');
                });

                // Set up control buttons
                d3.select('#prev-move-btn').on('click', () => tetrisVis.previousMove());
                d3.select('#play-pause-btn').on('click', () => tetrisVis.togglePlayPause());
                d3.select('#next-move-btn').on('click', () => tetrisVis.nextMove());
                d3.select('#speed-slider').on('input', function () {
                    const speed = this.value;
                    tetrisVis.setAnimationSpeed(speed);
                });

                tetrisVis.updateControlButtons();
                d3.select('#sequence-display').style('display', 'block');
            }
        });

        // Update initial board when inputs change
        document.querySelectorAll('#seed, #initialHeightMax').forEach(input => {
            input.addEventListener('change', updateInitialBoard);
        });

        function updateInitialBoard() {
            const seed = document.getElementById('seed').value;
            const initialHeightMax = document.getElementById('initialHeightMax').value;
            const goal = document.getElementById('goal').value;
            const tetrominoes = document.getElementById('tetrominoes').value;

            fetch('/generate_initial_board', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ seed, initialHeightMax, goal, tetrominoes }),
            })
                .then(response => response.json())
                .then(data => {
                    if (tetrisVis) {
                        tetrisVis.setBoard(data.board);
                    } else {
                        tetrisVis = new TetrisVisualization('tetris-board', 10, 20);
                        tetrisVis.setBoard(data.board);
                    }
                });
        }
    </script>
</body>

</html>
