<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Solver</title>
    <script src="https://unpkg.com/htmx.org@1.8.0"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #000;
            color: #0f0;
            line-height: 1.6;
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            border: 2px solid #0f0;
            padding: 20px;
            background-color: #001a00;
            box-shadow: 0 0 10px #0f0;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
        }

        h1, h2 {
            color: #0f0;
            text-align: center;
            text-shadow: 2px 2px #003300;
            width: 100%;
        }

        .tab-buttons {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .tab-button {
            background-color: #003300;
            color: #0f0;
            border: 2px solid #0f0;
            padding: 8px 16px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            transition: all 0.3s ease;
            margin: 0 5px;
        }

        .tab-button:hover:not([disabled]) {
            background-color: #004d00;
            box-shadow: 0 0 5px #0f0;
        }

        .tab-button.active {
            background-color: #006600;
            box-shadow: 0 0 10px #0f0;
        }

        .tab-button[disabled] {
            opacity: 0.5;
            cursor: not-allowed;
        }

        input[type="number"] {
            background-color: #001a00;
            color: #0f0;
            border: 2px solid #0f0;
            padding: 5px;
            font-family: 'Courier New', Courier, monospace;
        }

        button[type="submit"] {
            background-color: #006600;
            color: #0f0;
            border: 2px solid #0f0;
            padding: 10px 20px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            background-color: #008000;
            box-shadow: 0 0 10px #0f0;
        }

        form div {
            margin-bottom: 10px;
        }

        label {
            display: inline-block;
            width: 150px;
        }

        .tab-content {
            display: none;
            border: 2px solid #0f0;
            padding: 20px;
            margin-top: 20px;
            background-color: #001a00;
            width: 100%;
        }

        .active {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
        }

        #tetris-board {
            border: 2px solid #0f0;
            margin-top: 20px;
            box-shadow: 0 0 10px #0f0;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .speed-control {
            display: flex;
            align-items: center;
        }

        #speed-slider {
            margin-left: 10px;
        }

        #sequence-display {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #0f0;
            background-color: #001a00;
            width: 100%;
            overflow-x: auto;
            white-space: nowrap;
        }

        .tetromino-preview {
            display: inline-block;
            width: 20px;
            height: 20px;
            margin-right: 5px;
            border: 1px solid #0f0;
            text-align: center;
            line-height: 20px;
        }

        .form-container {
            width: 45%;
        }

        .results-container {
            width: 45%;
        }

        @media (max-width: 768px) {
            .form-container, .results-container {
                width: 100%;
            }
        }
    </style>
</head>

<body x-data x-init="Alpine.store('tab', 'simulation')">
    <div class="container">
        <h1>Tetris Solver</h1>

        <div class="tab-buttons">
            <button @click="setTab('simulation')" :class="{ 'tab-button': true, 'active': $store.tab === 'simulation' }">Simulation</button>
            <button @click="setTab('single-game')" :class="{ 'tab-button': true, 'active': $store.tab === 'single-game' }">Single Game</button>
        </div>

        <div x-show="$store.tab === 'simulation'" class="tab-content" :class="{ 'active': $store.tab === 'simulation' }">
            <h2>Run Simulation</h2>
            <div class="form-container">
                <form hx-post="/run_simulation" hx-trigger="submit" hx-target="#simulation-results" hx-swap="innerHTML">
                    <div>
                        <label for="goal">Goal:</label>
                        <input type="number" id="goal" name="goal" required value="8">
                    </div>
                    <div>
                        <label for="tetrominoes">Tetrominoes:</label>
                        <input type="number" id="tetrominoes" name="tetrominoes" required value="40">
                    </div>
                    <div>
                        <label for="initialHeightMax">Initial Height Max:</label>
                        <input type="number" id="initialHeightMax" name="initialHeightMax" required value="7">
                    </div>
                    <div>
                        <label for="numGames">Number of Games:</label>
                        <input type="number" id="numGames" name="numGames" required value="100">
                    </div>
                    <button type="submit">Run Simulation</button>
                </form>
            </div>
            <div class="results-container" id="simulation-results"></div>
        </div>

        <div x-show="$store.tab === 'single-game'" class="tab-content" :class="{ 'active': $store.tab === 'single-game' }">
            <h2>Run Single Game</h2>
            <div class="form-container">
                <form hx-post="/run_single_game" hx-trigger="submit" hx-target="#single-game-results" hx-swap="innerHTML">
                    <div>
                        <label for="seed">Seed:</label>
                        <input type="number" id="seed" name="seed" required value="42">
                    </div>
                    <div>
                        <label for="goal">Goal:</label>
                        <input type="number" id="goal" name="goal" required value="8">
                    </div>
                    <div>
                        <label for="tetrominoes">Tetrominoes:</label>
                        <input type="number" id="tetrominoes" name="tetrominoes" required value="40">
                    </div>
                    <div>
                        <label for="initialHeightMax">Initial Height Max:</label>
                        <input type="number" id="initialHeightMax" name="initialHeightMax" required value="7">
                    </div>
                    <button type="submit">Run Single Game</button>
                </form>
            </div>
            <div class="results-container" id="single-game-results"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/tetris_visualization.js') }}"></script>
    <script>
        let tetrisVis;

        function setTab(newTab) {
            Alpine.store('tab', newTab);
            updateURL(newTab);
        }

        function updateURL(tab) {
            const url = new URL(window.location);
            url.searchParams.set('tab', tab);
            window.history.pushState({}, '', url);
        }

        function loadTabFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            const tabParam = urlParams.get('tab');
            if (tabParam && (tabParam === 'simulation' || tabParam === 'single-game')) {
                Alpine.store('tab', tabParam);
            }
        }

        // Load tab from URL on page load
        window.addEventListener('load', loadTabFromURL);

        // Handle browser back/forward navigation
        window.addEventListener('popstate', loadTabFromURL);

        htmx.on("htmx:afterSwap", function (event) {
            if (event.detail.target.id === "simulation-results") {
                const data = JSON.parse(event.detail.xhr.response);
                const resultsDiv = d3.select('#simulation-results');
                resultsDiv.html('');
                resultsDiv.append('p').text(`Winnable games: ${data.winnable_games}`);
                resultsDiv.append('p').text(`Total games: ${data.total_games}`);
                resultsDiv.append('p').text(`Average time: ${data.average_time.toFixed(3)} seconds`);
                resultsDiv.append('p').text(`Average attempts: ${data.average_attempts.toFixed(2)}`);
            } else if (event.detail.target.id === "single-game-results") {
                const data = JSON.parse(event.detail.xhr.response);
                const resultsDiv = d3.select('#single-game-results');
                resultsDiv.html('');

                resultsDiv.append('p').text(`Result: ${data.result ? 'Winnable' : 'Not Winnable'}`);
                resultsDiv.append('p').text(`Failed Attempts: ${data.failedAttempts}`);

                // Create a container for the Tetris board
                const boardContainer = resultsDiv.append('div')
                    .attr('id', 'tetris-board')
                    .style('width', '300px')
                    .style('height', '600px');

                // Initialize the Tetris board visualization
                tetrisVis = new TetrisVisualization('tetris-board', 10, 20);
                tetrisVis.setBoard(data.initialBoard);
                tetrisVis.setMoves(data.moves);
                tetrisVis.setSequence(data.sequence);

                // Add controls for the visualization
                const controls = resultsDiv.append('div')
                    .attr('class', 'controls');

                controls.append('button')
                    .attr('id', 'prev-move-btn')
                    .text('Previous Move')
                    .on('click', () => tetrisVis.previousMove());

                controls.append('button')
                    .attr('id', 'play-pause-btn')
                    .text('Play')
                    .on('click', () => tetrisVis.togglePlayPause());

                controls.append('button')
                    .attr('id', 'next-move-btn')
                    .text('Next Move')
                    .on('click', () => tetrisVis.nextMove());

                // Add a speed slider
                const speedControl = controls.append('div').attr('class', 'speed-control');
                speedControl.append('label')
                    .attr('for', 'speed-slider')
                    .text('Animation Speed: ');
                speedControl.append('input')
                    .attr('type', 'range')
                    .attr('id', 'speed-slider')
                    .attr('min', '1')
                    .attr('max', '10')
                    .attr('value', '5')
                    .on('input', function () {
                        const speed = this.value;
                        tetrisVis.setAnimationSpeed(speed);
                    });

                // Add sequence display
                const sequenceDisplay = resultsDiv.append('div')
                    .attr('id', 'sequence-display');
                sequenceDisplay.append('h3').text('Tetromino Sequence:');
                const sequenceContainer = sequenceDisplay.append('div');

                data.sequence.forEach((tetromino, index) => {
                    sequenceContainer.append('span')
                        .attr('class', 'tetromino-preview')
                        .text(tetromino)
                        .style('background-color', index === 0 ? '#004d00' : 'transparent');
                });

                tetrisVis.updateControlButtons();
            }
        });

        // Update initial board when inputs change
        document.querySelectorAll('#seed, #initialHeightMax').forEach(input => {
            input.addEventListener('change', updateInitialBoard);
        });

        function updateInitialBoard() {
            const seed = document.getElementById('seed').value;
            const initialHeightMax = document.getElementById('initialHeightMax').value;
            const goal = document.getElementById('goal').value;
            const tetrominoes = document.getElementById('tetrominoes').value;

            fetch('/generate_initial_board', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ seed, initialHeightMax, goal, tetrominoes }),
            })
            .then(response => response.json())
            .then(data => {
                if (tetrisVis) {
                    tetrisVis.setBoard(data.board);
                } else {
                    tetrisVis = new TetrisVisualization('tetris-board', 10, 20);
                    tetrisVis.setBoard(data.board);
                }
            });
        }
    </script>
</body>

</html>
